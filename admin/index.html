<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Author Dashboard | Rider's Magic Mark</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; color: #172033; background: #fff5dd; }
      #setup { max-width: 760px; margin: 10vh auto; padding: 36px; background: #fffaf0; border-top: 6px solid #00bfc7; border-radius: 24px; box-shadow: 0 16px 50px #17203318; }
      h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 12px 0; }
      p, li { line-height: 1.7; }
      a { color: #174dc2; }
      #studio { position: fixed; inset: 0; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="setup">
      <p>RIDER'S MAGIC MARK</p>
      <h1>Author Dashboard</h1>
      <p id="setup-status" role="status">Loading your dashboard…</p>
      <ul>
        <li>Edit website text and book prices.</li>
        <li>Update the shipping announcement in one place.</li>
        <li>Upload curriculum PDFs and photographs.</li>
        <li>Add podcasts, articles, and book features.</li>
      </ul>
      <p><a href="/">Back to the website</a></p>
    </main>
    <div id="studio" hidden></div>
    <script type="module" src="/src/admin.js"></script>
  </body>
</html>
